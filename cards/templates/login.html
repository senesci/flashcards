{% extends 'base.html' %}

{% block content %}
  <section class="form-container">
    <div class="login-box">
      <h2>Login</h2>
      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="login-actions">
          <button type="submit" class="btn-primary">Login</button>
        </div>
      </form>

      <div class="register-link">
        <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
      </div>
    </div>
  </section>
{% endblock %}
