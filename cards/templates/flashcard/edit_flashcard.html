{% extends 'base.html' %}
{% block content %}
<section class="hero">
    <div class="hero-content">
        <h1>Editing "{{ card.term }}"</h1>
    </div>
</section>

<div class="margin-container">
    <div class="form-container">
        <div class="login-box">
            <h3 class="center">Edit Flashcard</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-primary" name="update_card">Save</button>
            </form>
            <h3 class="center">Danger Zone</h3>
            <form method="POST" onsubmit="return confirm('Are you sure you want to delete this flashcard? This action cannot be undone.');">
                {% csrf_token %}
                <button type="submit" class="btn-primary bg-alert" name="delete_card">Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
