<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Flashcard App</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'inter/inter.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">Flashcards</a>

            <div class="nav-links">
                <a href="{% url 'home' %}" class="nav-link">Home</a>
                <a href="{% url 'search' %}" class="nav-link">Search</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'user_profile' user.username %}" class="nav-link">Profile</a>
                    <a href="{% url 'user_settings' %}" class="nav-link">Settings</a>
                    <a href="{% url 'logout' %}" class="nav-link">Log Out</a>
                    {% if user.is_staff %}
                        <a href="{% url 'admin:index' %}" class="nav-link" ><strong style="text-decoration: underline; text-decoration-style: wavy;">Admin</strong></a>
                    {% endif %}
                {% else %}
                    <a href="{% url 'signup' %}" class="nav-link">Sign Up</a>
                    <a href="{% url 'login' %}" class="nav-link">Log In</a>
                {% endif %}
            </div>

            <button class="menu-btn" onclick="toggleMenu()">
                &#9776;
            </button>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.nav-links');
            menu.classList.toggle('open');
        }
    </script>
</body>
</html>
